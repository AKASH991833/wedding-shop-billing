name: Windows build + tests
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r desktop/requirements.txt pyinstaller
      - name: Data-layer tests
        run: python desktop/tests/test_db.py
      - name: Offscreen UI smoke test (demo mode, screenshots)
        shell: bash
        run: QT_QPA_PLATFORM=offscreen python desktop/app/main.py --demo --shot "$RUNNER_TEMP/shots"
      - name: Build Windows app (PyInstaller one-dir)
        run: pyinstaller --windowed --name ShopBilling --add-data "desktop/app/style.qss;." --exclude-module ssl --exclude-module _ssl --exclude-module _hashlib --exclude-module PySide6.QtNetwork --exclude-module PySide6.QtSvg desktop/app/main.py
      - name: Trim unused Qt payload
        shell: bash
        run: |
          rm -f dist/ShopBilling/_internal/PySide6/opengl32sw.dll
          rm -f dist/ShopBilling/_internal/PySide6/plugins/platforms/qdirect2d.dll
          rm -f dist/ShopBilling/_internal/PySide6/plugins/imageformats/qgif.dll dist/ShopBilling/_internal/PySide6/plugins/imageformats/qicns.dll dist/ShopBilling/_internal/PySide6/plugins/imageformats/qsvg.dll dist/ShopBilling/_internal/PySide6/plugins/imageformats/qtga.dll dist/ShopBilling/_internal/PySide6/plugins/imageformats/qwbmp.dll dist/ShopBilling/_internal/PySide6/plugins/imageformats/qtiff.dll dist/ShopBilling/_internal/PySide6/plugins/imageformats/qwebp.dll
          rm -rf dist/ShopBilling/_internal/PySide6/translations
      - name: Smoke test the built exe
        shell: bash
        timeout-minutes: 5
        run: QT_QPA_PLATFORM=offscreen ./dist/ShopBilling/ShopBilling.exe --demo --shot "$RUNNER_TEMP/exeshots"
      - name: Upload app bundle
        uses: actions/upload-artifact@v4
        with:
          name: ShopBilling-windows
          path: dist/ShopBilling/
